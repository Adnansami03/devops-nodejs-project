name: CI/CD Pipeline to AWS ECR & Minikube

on:
  push:
    branches: [ "main" ]  # Triggers the pipeline whenever you push to the main branch

env:
  AWS_REGION: us-east-1                    # Change to your specific ECR region if different
  ECR_REPOSITORY: node-app-repo            # Put your exact Amazon ECR repository name here

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets::AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets::AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Log in to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v1

    - name: Build, Tag, and Push Image to ECR
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}  # Uses the unique commit ID to prevent image caching issues
      run: |
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

  deploy-to-ec2:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
    - name: SSH into EC2 and Update Kubernetes
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets::EC2_HOST }}
        username: ubuntu
        key: ${{ secrets::EC2_SSH_KEY }}
        script: |
          # Navigate to your project folder on EC2
          cd ~/Minikube-Server || mkdir -p ~/Minikube-Server && cd ~/Minikube-Server
          
          # Pull down your deployment configuration updates or recreate the file
          # Force Kubernetes to roll out a clean update from ECR using the new image pull secret
          kubectl rollout restart deployment/node-app-deployment
          
          # Verify deployment state
          kubectl get pods